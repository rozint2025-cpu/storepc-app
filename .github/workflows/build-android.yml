# בונה קובץ App Bundle (.aab) חתום של אפליקציית סטור פיסי.
# הפעלה: GitHub ← Actions ← "Build Android App Bundle" ← Run workflow
name: Build Android App Bundle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    defaults:
      run:
        working-directory: storepc_app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.3'   # גרסה קבועה – כדי שהבנייה לא תישבר כש-Flutter מתעדכן
          cache: true

      - name: Check secrets
        run: |
          missing=""
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing  (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          flutter --version

      - name: Create missing platform files
        run: flutter create --org il.co --project-name storepc --platforms android .

      - name: Firebase config (push notifications)
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > /tmp/google-services.json
            python3 tools/make_firebase_options.py /tmp/google-services.json lib/firebase_options.dart
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret is missing - the app will be built WITHOUT push notifications"
          fi

      - name: Signing key
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing - Google Play will not accept an unsigned bundle"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          PROPS
          sed -i 's/^ *//' android/key.properties

      - name: Dependencies, icon and splash
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Build App Bundle
        run: flutter build appbundle --release --build-number ${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: storepc-app-bundle-${{ github.run_number }}
          path: storepc_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
